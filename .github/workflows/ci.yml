name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Unit tests
        run: npm run test:cov -- --ci

      # E2E suites boot the Nest app with mocked persistence — no DB required
      - name: E2E tests
        run: npm run test:e2e -- --ci

      - name: Build
        run: npm run build

  frontend:
    name: Frontend · lint, type-check, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run type-check

      - name: Build
        run: npm run build

  docker:
    name: Docker · build & smoke test full stack
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Build images and start the stack
        # --wait blocks until every service reports healthy (or fails)
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: API health check
        run: curl --fail --silent --show-error http://localhost:4000/api/v1/health

      - name: Demo login works (migrations + seed applied)
        run: |
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d '{"email":"sarah@northstar.io","password":"password123"}' \
            http://localhost:4000/api/v1/auth/login > /dev/null

      - name: Frontend responds
        run: curl --fail --silent --show-error --output /dev/null http://localhost:3000

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Tear down
        if: always()
        run: docker compose down --volumes

  dependency-audit:
    name: Dependency audit (critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Fails only on critical advisories in production dependencies;
    # lower-severity findings are still listed in the job log for review.
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit (${{ matrix.app }})
        run: npm audit --omit=dev --audit-level=critical
